name: SEO GEO Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  seo-geo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SEO/GEO validation
        shell: pwsh
        run: ./tools/seo-geo-maintenance.ps1
